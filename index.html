<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Checker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between items-center text-gray-800 p-4 max-w-md mx-auto">

    <header class="w-full flex justify-between items-center py-4 border-b border-gray-100 mb-2">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-gray-900">Grammar Assistant</h1>
            <p class="text-xs text-gray-500">AI-powered English sentence feedback</p>
        </div>
        <button id="api-key-btn" title="API Key Settings" class="p-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold flex items-center space-x-1.5 transition-all">
            <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z"/>
            </svg>
            <span>API Key</span>
        </button>
    </header>

    <!-- API Key Settings Modal -->
    <div id="api-key-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 hidden backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4 transform transition-all">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z"/>
                    </svg>
                    API Key 설정
                </h3>
                <button id="close-key-modal-btn" class="text-gray-400 hover:text-gray-600 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <p class="text-xs text-gray-500 leading-relaxed">
                Google Gemini API 키를 입력하여 사용할 수 있습니다. 입력하지 않으시면 기본 제공 키를 사용합니다.
            </p>

            <div class="space-y-1">
                <label for="api-key-input" class="text-xs font-semibold text-gray-700 block">Gemini API Key</label>
                <input type="password" id="api-key-input" placeholder="AIzaSy..." 
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" />
            </div>

            <div id="key-status-msg" class="text-xs text-gray-500 flex items-center gap-1"></div>

            <div class="flex space-x-2 pt-2">
                <button id="clear-key-btn" class="flex-1 py-2.5 border border-gray-300 text-gray-700 text-xs font-semibold rounded-xl hover:bg-gray-50 transition-all">
                    초기화
                </button>
                <button id="save-key-btn" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-sm transition-all">
                    저장
                </button>
            </div>
        </div>
    </div>

    <main id="input-view" class="w-full flex-1 flex flex-col justify-center px-2 space-y-4">
        <!-- Error Alert Banner -->
        <div id="error-banner" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-center space-x-3 shadow-sm transition-all">
            <svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <span id="error-message" class="text-sm font-medium">유효한 영어 문장을 입력해주세요!</span>
        </div>

        <div class="space-y-2">
            <label for="sentence-input" class="block text-sm font-medium text-gray-700">
                영어 문장을 입력하세요
            </label>
            <textarea id="sentence-input" rows="4" 
                class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 text-base outline-none resize-none transition-all shadow-sm"
                placeholder="Type your English sentence here..."></textarea>
        </div>

        <button id="enter-btn" 
            class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md transition-all active:scale-98 flex items-center justify-center space-x-2">
            <span>ENTER</span>
        </button>
    </main>

    <main id="loading-view" class="w-full flex-1 flex flex-col justify-center items-center hidden space-y-4">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div>
        <p class="text-sm font-medium text-gray-600">Analyzing your sentence...</p>
    </main>

    <main id="result-view" class="w-full flex-1 flex flex-col justify-between hidden py-2 overflow-y-auto">
        <div id="result-content" class="space-y-4 w-full pr-1">
            <!-- Dynamic feedback will be inserted here -->
        </div>

        <div class="pt-6 pb-2 w-full">
            <button id="again-btn" 
                class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl shadow-md transition-all active:scale-98">
                AGAIN
            </button>
        </div>
    </main>

    <footer class="w-full text-center py-4 text-xs text-gray-400">
        Mobile Web App &copy; 2026
    </footer>

    <script>
        const inputView = document.getElementById('input-view');
        const loadingView = document.getElementById('loading-view');
        const resultView = document.getElementById('result-view');
        
        const sentenceInput = document.getElementById('sentence-input');
        const enterBtn = document.getElementById('enter-btn');
        const againBtn = document.getElementById('again-btn');
        const resultContent = document.getElementById('result-content');
        const errorBanner = document.getElementById('error-banner');
        const errorMessage = document.getElementById('error-message');

        // API Key Modal Elements
        const apiKeyBtn = document.getElementById('api-key-btn');
        const apiKeyModal = document.getElementById('api-key-modal');
        const closeKeyModalBtn = document.getElementById('close-key-modal-btn');
        const apiKeyInput = document.getElementById('api-key-input');
        const saveKeyBtn = document.getElementById('save-key-btn');
        const clearKeyBtn = document.getElementById('clear-key-btn');
        const keyStatusMsg = document.getElementById('key-status-msg');

        // Update API Key UI State
        function updateKeyStatusUI() {
            const storedKey = localStorage.getItem('user_gemini_api_key');
            if (storedKey) {
                apiKeyInput.value = storedKey;
                keyStatusMsg.innerHTML = '<span class="text-emerald-600 font-medium">✓ 사용자 API Key가 설정되어 있습니다.</span>';
                apiKeyBtn.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
                apiKeyBtn.classList.remove('bg-gray-100', 'text-gray-700');
            } else {
                apiKeyInput.value = '';
                keyStatusMsg.innerHTML = '<span class="text-gray-400">기본 제공 API Key를 사용 중입니다.</span>';
                apiKeyBtn.classList.remove('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
                apiKeyBtn.classList.add('bg-gray-100', 'text-gray-700');
            }
        }

        apiKeyBtn.addEventListener('click', () => {
            updateKeyStatusUI();
            apiKeyModal.classList.remove('hidden');
        });

        closeKeyModalBtn.addEventListener('click', () => {
            apiKeyModal.classList.add('hidden');
        });

        saveKeyBtn.addEventListener('click', () => {
            const keyVal = apiKeyInput.value.trim();
            if (keyVal) {
                localStorage.setItem('user_gemini_api_key', keyVal);
            } else {
                localStorage.removeItem('user_gemini_api_key');
            }
            updateKeyStatusUI();
            apiKeyModal.classList.add('hidden');
        });

        clearKeyBtn.addEventListener('click', () => {
            localStorage.removeItem('user_gemini_api_key');
            apiKeyInput.value = '';
            updateKeyStatusUI();
            apiKeyModal.classList.add('hidden');
        });

        function getApiKey() {
            return localStorage.getItem('user_gemini_api_key') || "";
        }

        // Initialize API Key UI state
        updateKeyStatusUI();

        // Show inline error banner
        function showError(msg) {
            errorMessage.textContent = msg;
            errorBanner.classList.remove('hidden');
            setTimeout(() => {
                errorBanner.classList.add('shake');
            }, 10);
        }

        // Hide inline error banner
        function hideError() {
            errorBanner.classList.add('hidden');
        }

        // Switch active views
        function switchView(viewName) {
            inputView.classList.add('hidden');
            loadingView.classList.add('hidden');
            resultView.classList.add('hidden');

            if (viewName === 'input') inputView.classList.remove('hidden');
            if (viewName === 'loading') loadingView.classList.remove('hidden');
            if (viewName === 'result') resultView.classList.remove('hidden');
        }

        // Client-side quick gibberish detection
        function isGibberish(str) {
            const clean = str.trim().toLowerCase();
            // Check for identical repeated characters (e.g., "aaaaa")
            if (/(.)\1{3,}/.test(clean)) return true;
            // Words over 3 chars with no vowels (e.g., "zxcv", "sdfgh")
            if (/^[a-z]{4,}$/.test(clean) && !/[aeiouy]/.test(clean)) return true;
            // Known keyboard mash sequences
            const mashes = ['asdf', 'qwerty', 'zxcv', 'dfgh', 'jkl;'];
            for (const mash of mashes) {
                if (clean.includes(mash) && clean.length <= 15) return true;
            }
            return false;
        }

        // Call Gemini API with exponential backoff for grammar analysis
        async function analyzeSentence(sentence, retries = 3, delay = 1000) {
            const systemPrompt = `You are a professional English grammar expert. 
Analyze the user's input sentence or phrase.
First, determine if the input is a valid English sentence, phrase, or word. If it is random keyboard typing/gibberish (e.g. "asdfadsf", "qwerty", random noise), set "isValid" to false.

Return a structured JSON with:
- "isValid": (boolean) whether the input is valid English text or just meaningless gibberish/nonsense.
- "errorMessage": (string in Korean) if isValid is false, explain why it is invalid (e.g., "의미를 알 수 없는 무작위 문자열입니다.").
- "analysis": (string in Korean) 어색한 점이나 문법 오류 설명
- "betterExpression": (string) 더 나은 표현 (없으면 원문 유지하되 개선본 제공)
- "variations": (array of strings) 다양하게 바꿀 수 있는 표현들`;

            const payload = {
                contents: [{ parts: [{ text: `Analyze this sentence: "${sentence}"` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            isValid: { type: "BOOLEAN" },
                            errorMessage: { type: "STRING" },
                            analysis: { type: "STRING" },
                            betterExpression: { type: "STRING" },
                            variations: {
                                type: "ARRAY",
                                items: { type: "STRING" }
                            }
                        },
                        propertyOrdering: ["isValid", "errorMessage", "analysis", "betterExpression", "variations"]
                    }
                }
            };

            const apiKey = getApiKey();
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    if (response.status === 429 && retries > 0) {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return analyzeSentence(sentence, retries - 1, delay * 2);
                    }
                    throw new Error('API request failed');
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    return JSON.parse(candidate.content.parts[0].text);
                } else {
                    throw new Error('Invalid response structure');
                }
            } catch (error) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return analyzeSentence(sentence, retries - 1, delay * 2);
                }
                throw error;
            }
        }

        // Render result data into UI cards
        function renderResult(data) {
            resultContent.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-gray-50 border border-gray-100 p-4 rounded-xl shadow-sm">
                        <h3 class="text-xs font-semibold uppercase tracking-wider text-emerald-600 mb-1">문법 오류 및 어색한 점</h3>
                        <p class="text-sm text-gray-700 leading-relaxed">${escapeHtml(data.analysis || '')}</p>
                    </div>

                    <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-xl shadow-sm">
                        <h3 class="text-xs font-semibold uppercase tracking-wider text-emerald-700 mb-1">더 나은 표현</h3>
                        <p class="text-sm font-semibold text-emerald-900">${escapeHtml(data.betterExpression || '')}</p>
                    </div>

                    <div class="bg-gray-50 border border-gray-100 p-4 rounded-xl shadow-sm">
                        <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">다양한 표현 변형</h3>
                        <ul class="space-y-2">
                            ${(data.variations || []).map(v => `<li class="text-sm text-gray-700 bg-white p-2.5 rounded-lg border border-gray-200">${escapeHtml(v)}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
        }

        // Escape HTML to prevent injection
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Event listener for ENTER button
        enterBtn.addEventListener('click', async () => {
            hideError();
            const text = sentenceInput.value.trim();
            
            // 1. Client-side validation checks
            if (!text || text.length < 2 || /^[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]*$/.test(text) || isGibberish(text)) {
                showError('유효하지 않거나 의미를 알 수 없는 문자열입니다. 올바른 영어 문장을 입력해주세요.');
                return;
            }

            switchView('loading');
            try {
                const analysisResult = await analyzeSentence(text);
                
                // 2. AI model level validation check
                if (analysisResult.isValid === false) {
                    showError(analysisResult.errorMessage || '의미를 알 수 없는 입력입니다. 올바른 영어 문장을 입력해주세요.');
                    switchView('input');
                    return;
                }

                renderResult(analysisResult);
                switchView('result');
            } catch (err) {
                console.error(err);
                showError('분석 중 오류가 발생했습니다. 다시 시도해주세요.');
                switchView('input');
            }
        });

        // Event listener for AGAIN button
        againBtn.addEventListener('click', () => {
            sentenceInput.value = '';
            hideError();
            switchView('input');
        });
    </script>
</body>
</html>
